name: ci
# main only ever moves by fast-forward to a develop commit that already passed, so it needs no run of its own.
on:
  push:
    branches: [develop]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # check-progress diffs against origin/develop
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No go.sum until the first dependency; key the build/test cache on go.mod instead.
          cache-dependency-path: go.mod
      - run: make check
