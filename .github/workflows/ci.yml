name: ci
# main only ever moves by fast-forward to a develop commit that already passed, so it needs no run of its own.
on:
  push:
    branches: [develop]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # check-progress diffs against origin/develop
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check
      # CI only: it downloads the tool and the vulnerability database, too slow for the commit hook.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
